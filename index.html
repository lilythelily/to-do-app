<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Todo app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
<div class="top-bg"></div>
<div class="bottom-bg"></div>

<section class="section-to-do">


  <div class="h1-icon">
      <h1>Todo</h1><button class="theme-icon" aria-label="Toggle theme" aria-pressed="false"></button>
  </div>


  <div class="task-field">
  <div class="empty-check-mark"></div><label for="new-task"></label><input type="text" name="new-task" id="new-task" placeholder="Create a new todo..."></div>

  <!-- --- added tasks --- -->
   <div class="added-task-wrapper">
   <ul>
    <li class="task-added task-deleted" draggable="true"><div class="check-text"><button type="button" class="checked"></button>Complete online JavaScript course</div><button type="button" class="delete-btn hide" aria-label="Delete task"></button></li>
     <li class="task-added" draggable="true"><div class="check-text"><button type="button" class="empty-check-mark" aria-label="Mark as complete"></button>Jog around the park 3x</div><button type="button" class="delete-btn hide" aria-label="Delete task"></button></li>
<li class="task-added" draggable="true"><div class="check-text"><button type="button" class="empty-check-mark" aria-label="Mark as complete"></button>10 minutes meditation</div><button type="button" class="delete-btn hide" aria-label="Delete task"></button></li>
<li class="task-added" draggable="true"><div class="check-text"><button type="button" class="empty-check-mark" aria-label="Mark as complete"></button>Read for 1 hour</div><button type="button" class="delete-btn hide" aria-label="Delete task"></button></li>
<li class="task-added" draggable="true"><div class="check-text"><button type="button" class="empty-check-mark" aria-label="Mark as complete"></button>Pick up groceries</div><button type="button" class="delete-btn hide" aria-label="Delete task"></button></li>
<li class="task-added" draggable="true"><div class="check-text"><button type="button" class="empty-check-mark" aria-label="Mark as complete"></button>Complete Todo App on Frontend Mentor</div><button type="button" class="delete-btn hide" aria-label="Delete task"></button></li>
   </ul>

  <!-- Add dynamic number --> 
  
  <div class="control-bar">
    <p class="item-left"><span class="number">5</span> items left</p>

    <div class="control-middle">
      <button type="button" class="control__text control__active" aria-label="All select">All</button>
       <button type="button" class="control__text" aria-label="Active select">Active</button>
       <button type="button" class="control__text" aria-label="Completed select">Completed</button>
    </div>

<button type="button" class="clear" aria-label="Clear completed tasks">Clear Completed</button>
  </div>

  
</div>
<!-- --- control middle for mobile --- -->
 <div class="middle__mobile">
    <p class="control__text control__active control__text-mobile">All</p>
     <p class="control__text control__text-mobile">Active</p>
     <p class="control__text control__text-mobile">Completed</p>
  </div>

<p class="drag">Drag and drop to reorder list</p>  
</section>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by KaoriA.
  </footer>

 <script src="main01.js"></script>
</body>
</html>
